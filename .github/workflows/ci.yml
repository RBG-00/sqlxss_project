name: Python CI

on:
  push:
    branches: [ main, pha, phase4 ]
  pull_request:
    branches: [ main, pha, phase4 ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run syntax check
      run: |
        python -m compileall .

    # ---------- Phase 5 additions ----------
    - name: Crawl target website
      env:
        TARGET_URL: ${{ secrets.SCAN_TARGET_URL }}   # ضع عنوان الهدف هنا داخل secrets
      run: |
        mkdir -p reports
        python crawler.py --start-url "${TARGET_URL}" --max-depth 2 --rate 1 \
          --out-json reports/targets.json --out-list reports/targets.txt

    - name: Run scanner on discovered URLs
      run: |
        python scanner.py --file reports/targets.txt --threads 4 --delay 0.2 \
          --report-json reports/report.json --report-txt reports/report.txt --auto-verify

    - name: Upload reports artifact
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: reports/
