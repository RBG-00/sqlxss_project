name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: pip install -r requirements.txt || pip install requests flask pytest
      - name: Run tests (script)
        run: chmod +x run_tests.sh && ./run_tests.sh
      - name: Run pytest
        run: pytest -q
